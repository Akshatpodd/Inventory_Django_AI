{% extends 'base.html' %}
{% block title %}Reports{% endblock %}
{% block content %}
<h1 class="h3 mb-3">Reports</h1>
<div class="row g-3">{% for r in reports %}
  <div class="col-md-4"><div class="card h-100"><div class="card-body"><h2 class="h5">{{ r.title }}</h2><p class="text-muted small">{{ r.description }}</p>
    <a class="btn btn-primary btn-sm" href="{% url 'reports:'|add:r.slug %}">Open</a></div></div></div>{% endfor %}</div>
{% endblock %}
