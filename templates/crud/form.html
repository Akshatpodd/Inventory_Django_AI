{% extends 'base.html' %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<div class="card" style="max-width: 760px;"><div class="card-body">
  <h1 class="h4 mb-3">{{ title }}</h1>
  {% if note %}<div class="alert alert-info">{{ note }}</div>{% endif %}
  <form method="post" {% if multipart %}enctype="multipart/form-data"{% endif %}>{% csrf_token %}
    {% include 'includes/form_fields.html' %}
    <button class="btn btn-primary">Save</button>
    <a class="btn btn-outline-secondary" href="{{ cancel_url }}">Cancel</a>
  </form>
</div></div>
{% endblock %}
